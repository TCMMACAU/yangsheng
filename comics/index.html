:root{--paper:#f3ecdf;--ink:#2b2620;--soft:#5b5246;--line:#e0d5c2;--card:#faf6ee;--jade:#3F6B5C;--clay:#9a5b2e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.85 'Noto Sans TC',sans-serif}
a{color:var(--jade)}/* header chrome via .site-hdr */
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.top img{height:30px}.top a{text-decoration:none;color:var(--ink);font-family:'Noto Serif TC',serif}
/* nav chrome via .hdr-nav */
h1,h2,h3{font-family:'Noto Serif TC',serif;font-weight:600;line-height:1.3}
h1{font-size:44px;margin:36px 0 6px}.lead{color:var(--soft);margin:0 0 24px}
.kicker{color:var(--clay);font-size:13px;letter-spacing:.1em}
.terms{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px}.terms a,.terms span{font-size:14px;padding:3px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--soft)}
.terms span{opacity:.45}.terms a.now{background:var(--jade);color:#fff;border-color:var(--jade)}
article{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 26px 18px;margin:0 0 28px}
article h2{font-size:34px;margin:4px 0 2px}.date{color:var(--soft);font-size:14px;margin:0 0 14px}
article h3{font-size:19px;margin:22px 0 6px;color:var(--jade)}
ol{padding-left:1.3em;margin:0}li{margin:0 0 6px}li b{font-family:'Noto Serif TC',serif}
blockquote{margin:6px 0;padding:10px 16px;border-left:3px solid var(--jade);background:#f1eadc;font-family:'Noto Serif TC',serif;font-size:18px}
blockquote cite{display:block;font-size:13px;color:var(--soft);font-style:normal;margin-top:4px}
.to{display:inline-block;margin-top:18px;padding:8px 18px;border:1px solid var(--ink);border-radius:99px;color:var(--ink);text-decoration:none;font-size:14px}
footer{color:var(--soft);font-size:13px;padding:10px 0 40px}
@media(max-width:480px){h1{font-size:34px}article{padding:20px 18px 14px}article h2{font-size:28px}blockquote{font-size:16px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:0 0 30px}.grid a{text-align:center;font-size:15px;padding:4px 0;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--soft);font-family:'Noto Serif TC',serif}.grid a.now{background:var(--jade);color:#fff;border-color:var(--jade)}.sg{font-size:13px;color:var(--clay);letter-spacing:.2em;margin:26px 0 8px}.wx{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}.wx div{background:#f1eadc;border-radius:14px;padding:10px 6px;text-align:center;font-size:14px}.wx b{display:block;font-family:'Noto Serif TC',serif;font-size:20px;color:var(--jade)}@media(max-width:480px){.wx{grid-template-columns:repeat(3,1fr)}}.ill{display:block;width:100%;height:auto;border-radius:18px;margin:8px 0 14px;background:#ece4d4}
/* site chrome aligned with SPA */
.site-hdr{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line,#d8ccb6);background:rgba(243,236,223,.95);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hdr-top{max-width:72rem;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:var(--ink,#1c241f)}
.brand img{height:40px;width:auto;max-width:10rem;object-fit:contain;flex-shrink:0}
.brand-txt{min-width:0}.brand-title{display:block;font-family:'Noto Serif TC',serif;font-size:1.25rem;line-height:1;color:var(--ink,#1c241f)}
.brand-sub{display:none;margin-top:4px;font-size:12px;color:var(--muted,#6e6558)}
@media(min-width:640px){.brand img{height:44px;max-width:none}.brand-sub{display:block}}
.hdr-actions{display:flex;align-items:center;gap:8px}
.notes-btn{display:inline-flex;align-items:center;height:44px;padding:0 12px;border:1px solid var(--line,#d8ccb6);border-radius:999px;font-size:14px;color:var(--ink,#1c241f);text-decoration:none}
.hdr-nav{max-width:72rem;margin:0 auto;padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:4px}
.nav-pill{display:inline-flex;align-items:center;height:44px;padding:0 16px;border-radius:999px;font-size:14px;color:var(--soft,#3d4942);text-decoration:none;flex-shrink:0;white-space:nowrap}
.nav-pill:hover{background:#e6dcc8}.nav-pill.on{background:var(--ink,#1c241f);color:#f3ecdf}
.site-ftr{margin-top:4rem;border-top:1px solid var(--line,#d8ccb6)}
.ftr-inner{max-width:72rem;margin:0 auto;padding:32px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.ftr-inner img{height:48px;width:auto;object-fit:contain}
.ftr-txt{min-width:0;flex:1;font-size:14px;color:var(--muted,#6e6558);line-height:1.65}
.ftr-note{margin-top:12px}

.brand{flex:1 1 auto}.hdr-top{overflow:visible}.site-hdr{overflow:visible}
.brand-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.hdr-actions{flex-shrink:0}
.season-chip{display:none;align-items:center;height:44px;padding:0 12px;border-radius:999px;background:#e8dfd0;font-size:14px;color:var(--soft,#3d4942);white-space:nowrap}
.notes-btn{gap:6px;flex-shrink:0;white-space:nowrap}
.notes-btn svg{width:16px;height:16px;flex-shrink:0}
.notes-n{font-variant-numeric:tabular-nums;color:var(--muted,#6e6558);margin-left:2px}
#ys-music{flex-shrink:0}
#ys-music .ys-btn{min-height:44px;height:44px;max-width:9rem;font-size:14px;padding:0 12px;letter-spacing:0;display:inline-flex;align-items:center}
@media(min-width:640px){.season-chip{display:inline-flex}}
@media(max-width:640px){#ys-music .ys-btn{max-width:6.5rem;font-size:12px;padding:0 10px}}

@media print{.site-hdr,.site-ftr{display:none!important}}

.ca-grid{display:grid;grid-template-columns:1fr;gap:18px;margin:8px 0 40px}
@media(min-width:720px){.ca-grid{grid-template-columns:1fr 1fr}}
.ca-card{display:block;position:relative;background:var(--card,#faf6ee);border:1px solid var(--line,#e0d5c2);border-radius:20px;padding:16px 16px 14px;text-decoration:none;color:inherit}
.ca-card:hover{border-color:#3F6B5C}
.ca-card h2{font-size:24px;margin:12px 0 2px;color:var(--ink,#2b2620)}
.ca-card .date{margin:0;color:var(--soft,#5b5246);font-size:14px}
.ca-thumb{overflow:hidden;border:1px solid var(--line,#e0d5c2);border-radius:20px;background:var(--paper,#f3ecdf)}
.ca-thumb img,.ca-full img{display:block;width:100%;height:auto}
.ca-badge{position:absolute;top:22px;left:22px;z-index:1;display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:#3F6B5C;color:#fff;font-size:12px;letter-spacing:.08em}
.ca-badge-inline{position:static;margin:8px 0 0}
.ca-full{overflow:hidden;border:1px solid var(--line,#e0d5c2);border-radius:20px;background:var(--paper,#f3ecdf);margin:0 0 18px}
.ca-foot{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;font-size:.875rem;margin:0 0 48px}
.ca-foot a,.ca-back{color:#3F6B5C;text-decoration:none;border-bottom:1px solid rgba(63,107,92,.35)}
@media(max-width:480px){.ca-card h2{font-size:22px}}
