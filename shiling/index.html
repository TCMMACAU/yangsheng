<main class="wrap"><p class="kicker" style="margin-top:32px">順時而食 · 每節氣更新</p><h1 style="margin-top:4px">節氣食譜與一分鐘保健</h1>
<p class="lead">每個節氣選一兩款家常湯水或茶飲，用的都是街市常見的平和食材；再配一個一分鐘就做得到的簡單保健。食譜只是家常參考，懷孕、有長期病患或正在服藥，請先諮詢醫師。</p>
